<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoadLink — Logistics Network</title>
<style>
:root{--bg:#07100d;--p:#0d1814;--p2:#111f1a;--l:#20352d;--t:#eef8f3;--m:#8da79b;--g:#19d58a;--r:#ff6b6b;--b:#72c8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#123c2b,#07100d 36%);color:var(--t);font:14px Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hide{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox,.card,.stat{background:linear-gradient(145deg,#101e18,#0b1713);border:1px solid var(--l);border-radius:18px;box-shadow:0 8px 28px #0004}.authbox{width:min(470px,100%);padding:30px}.brand{font-size:25px;font-weight:900}.brand span,.price,.eyebrow{color:var(--g)}h1{font-size:32px;margin:7px 0}h2{margin:0}.muted{color:var(--m)}.tabs,.switch{display:flex;background:#0b1713;border:1px solid var(--l);padding:4px;border-radius:13px}.tabs{margin:22px 0}.tabs button,.switch button{flex:1;border:0;background:transparent;color:var(--m);padding:10px;border-radius:10px;font-weight:800}.tabs button.active,.switch button.active{background:#143126;color:#fff}.form{display:grid;gap:12px}.field{width:100%;padding:12px;border-radius:11px;border:1px solid var(--l);background:#0b1713;color:#fff;outline:0}.field:focus{border-color:#2d7759}label{display:block;color:#a9beb5;font-size:12px;font-weight:700;margin-bottom:6px}.row{display:flex;gap:10px}.row>*{flex:1}.btn{border:1px solid var(--l);background:#112019;color:#eafff5;padding:11px 16px;border-radius:11px;font-weight:800}.btn.primary{background:var(--g);border-color:var(--g);color:#04120c}.btn.danger{background:#351616;border-color:#5d2828;color:#ffaaaa}.link{border:0;background:none;color:var(--g);font-weight:700}.top{height:72px;border-bottom:1px solid var(--l);background:#08120fdd;backdrop-filter:blur(16px);display:flex;align-items:center;padding:0 25px;gap:20px;position:sticky;top:0;z-index:10}.switch{margin:auto;width:min(420px,50%)}.topright{display:flex;align-items:center;gap:10px}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#23e99b,#0b6242);font-weight:900}.layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 72px)}aside{border-right:1px solid var(--l);padding:20px 14px;background:#09130f}.navtitle{font-size:10px;color:#587168;font-weight:900;letter-spacing:1.5px;padding:8px}.nav{width:100%;border:0;background:none;color:#8fa89e;padding:12px;border-radius:11px;text-align:left;margin:2px 0}.nav.active,.nav:hover{background:#10251c;color:#fff}.count{float:right;background:#18382b;color:#72efb7;border-radius:99px;padding:2px 7px;font-size:10px}.main{padding:30px;max-width:1500px;width:100%;margin:auto}.hero{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:25px}.eyebrow{font-size:12px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:18px}.stat small{color:var(--m)}.stat strong{display:block;font-size:25px;margin-top:7px}.section{margin-top:25px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.filters{display:grid;grid-template-columns:1.2fr 1.2fr 1fr .8fr auto;gap:9px;margin-bottom:15px}.loads{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.load{padding:18px}.route{display:grid;grid-template-columns:1fr 30px 1fr;gap:8px;align-items:center}.city{font-size:17px;font-weight:850}.arrow{text-align:center;color:#66857a}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tag,.status,.verified{padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800}.tag{background:#14251f;border:1px solid #234237;border-radius:8px}.verified{color:#75efb8;background:#0c2b20;border:1px solid #1b674b}.status{display:inline-block}.looking{color:#f2ca6a;background:#3b2d0e}.assigned{color:#78c9ff;background:#0b2d40}.transit{color:#9be9c8;background:#0b3626}.delivered{color:#b4b9c1;background:#252b2a}.company{border-top:1px solid var(--l);padding-top:12px;margin-top:12px;display:flex;justify-content:space-between;gap:10px}.actions{display:flex;gap:8px;margin-top:14px}.actions .btn{flex:1;text-align:center;text-decoration:none}.trip{padding:18px;display:flex;justify-content:space-between;gap:20px;align-items:center}.modalbg{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:30;padding:15px}.modalbg.show{display:grid}.modal{width:min(700px,100%);max-height:90vh;overflow:auto;background:#0c1813;border:1px solid #29473b;border-radius:18px;padding:23px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;right:20px;bottom:20px;background:#10251c;border:1px solid #34745a;padding:13px 16px;border-radius:12px;display:none;z-index:50}.empty{text-align:center;padding:30px;color:var(--m)}.notice{padding:12px;background:#0e2119;border:1px solid #2a4a3d;border-radius:12px;margin:10px 0}.menu{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}.menu{display:block}.grid{grid-template-columns:1fr 1fr}.loads{grid-template-columns:1fr}.top{padding:0 10px}.switch{width:auto}.switch button{font-size:11px;padding:8px}.profileName{display:none}.main{padding:18px}.filters{grid-template-columns:1fr 1fr}.filters .btn{grid-column:1/-1}.hero{align-items:start;flex-direction:column}}@media(max-width:560px){.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.grid{grid-template-columns:1fr 1fr}.trip{align-items:start;flex-direction:column}.actions{flex-direction:column}.switch{display:none}}
</style></head><body>
<div id="auth" class="auth"><div class="authbox"><div class="brand">Load<span>Link</span></div><div id="authIntro"><h1>Welcome back</h1><p class="muted">Sign in to manage loads and trips.</p></div><div class="tabs"><button id="lt" class="active" onclick="authMode('login')">Login</button><button id="rt" onclick="authMode('register')">Create account</button></div><div id="authForm"></div></div></div>
<div id="app" class="hide"><header class="top"><button class="btn menu" onclick="toggleSide()">☰</button><div class="brand">Load<span>Link</span></div><div class="switch"><button id="ds" onclick="roleSwitch('driver')">🚚 Driver</button><button id="ss" onclick="roleSwitch('shipper')">🏢 Shipper</button></div><div class="topright"><button class="btn" onclick="setView('notifications')">🔔 <b id="nc">0</b></button><button class="btn" onclick="setView('trips')">📦 <b id="tc">0</b></button><div class="avatar" id="avatar">U</div><b class="profileName" id="pname">User</b></div></header><div class="layout"><aside id="side"><div class="navtitle">WORKSPACE</div><button class="nav active" id="nh" onclick="setView('home')">⌂ <span id="hl">Find Loads</span></button><button class="nav" id="nt" onclick="setView('trips')">▣ Active Trips <span class="count" id="sc">0</span></button><button class="nav" id="nl" onclick="setView('loads')">◫ My Loads</button><button class="nav" id="nn" onclick="setView('notifications')">🔔 Notifications <span class="count" id="ncc">0</span></button><div class="navtitle">ACCOUNT</div><button class="nav" onclick="verifyModal()">✓ Verification Center</button><button class="nav" onclick="setView('settings')">⚙ Settings</button><button class="nav" onclick="logout()">↪ Logout</button></aside><main class="main" id="main"></main></div></div>
<div class="modalbg" id="mb"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>
let session=null,profile=null,role='driver',view='home',loads=[],trips=[],notes=[],beat=null,refresh=null,filters={origin:'',destination:'',truck:'',min:''};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),money=n=>Number(n||0).toLocaleString('en-IN');
function toast(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2800)}function openM(x){$('modal').innerHTML=x;$('mb').classList.add('show')}function closeM(){$('mb').classList.remove('show')}$('mb').onclick=e=>{if(e.target.id==='mb')closeM()};
function authMode(m){$('lt').classList.toggle('active',m==='login');$('rt').classList.toggle('active',m==='register');if(m==='login'){$('authIntro').innerHTML='<h1>Welcome back</h1><p class="muted">Sign in to manage loads and trips.</p>';$('authForm').innerHTML='<div class="form"><div><label>Email</label><input id="email" class="field" type="email" autocomplete="email"></div><div><label>Password</label><input id="pass" class="field" type="password" autocomplete="current-password"></div><button class="btn primary" onclick="login()">Login</button><button class="link" onclick="forgot()">Forgot password?</button></div>'}else{$('authIntro').innerHTML='<h1>Create your account</h1><p class="muted">Join as a driver or shipper.</p>';$('authForm').innerHTML='<div class="form"><div class="formgrid"><div><label>Full Name *</label><input id="rn" class="field"></div><div><label>Phone</label><input id="rp" class="field"></div><div><label>Role *</label><select id="rr" class="field"><option value="driver">Driver</option><option value="shipper">Shipper / Owner</option></select></div><div><label>Company</label><input id="rc" class="field"></div></div><div><label>Email *</label><input id="re" class="field" type="email"></div><div><label>Password *</label><input id="rpa" class="field" type="password"></div><div><label>Confirm Password *</label><input id="rpc" class="field" type="password"></div><button class="btn primary" onclick="register()">Create account</button></div>'}}
async function login(){let email=$('email').value.trim(),password=$('pass').value;if(!email||!password)return toast('Enter email and password');let {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)toast(error.message)}
async function register(){let n=$('rn').value.trim(),p=$('rp').value.trim(),r=$('rr').value,c=$('rc').value.trim(),e=$('re').value.trim(),pw=$('rpa').value,pc=$('rpc').value;if(!n||!e||!pw)return toast('Complete required fields');if(pw.length<6)return toast('Password must be at least 6 characters');if(pw!==pc)return toast('Passwords do not match');let {data,error}=await supabaseClient.auth.signUp({email:e,password:pw,options:{data:{full_name:n,phone:p,role:r,company_name:c}}});if(error)return toast(error.message);toast(data.session?'Account created':'Account created — check your email to confirm')}
async function forgot(){let e=prompt('Enter your LoadLink email');if(!e)return;let {error}=await supabaseClient.auth.resetPasswordForEmail(e,{redirectTo:location.href});toast(error?error.message:'Reset email sent')}
async function logout(){if(session)await supabaseClient.from('profiles').update({is_online:false,last_active:new Date().toISOString()}).eq('user_id',session.user.id);await supabaseClient.auth.signOut()}
async function boot(){let {data}=await supabaseClient.auth.getSession();if(data.session)start(data.session);else authMode('login');supabaseClient.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_OUT'){stop();session=null;profile=null;$('app').classList.add('hide');$('auth').classList.remove('hide');authMode('login')}else if(s&&!session)start(s)})}
async function start(s){session=s;let q=await supabaseClient.from('profiles').select('*').eq('user_id',s.user.id).single();profile=q.data;if(!profile)return toast('Profile not found. Check your signup trigger.');role=profile.role||'driver';$('auth').classList.add('hide');$('app').classList.remove('hide');header();await data();heartbeat();render()}
function header(){let n=profile.full_name||'User';$('pname').textContent=n;$('avatar').textContent=n.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();$('ds').classList.toggle('active',role==='driver');$('ss').classList.toggle('active',role==='shipper');$('hl').textContent=role==='driver'?'Find Loads':'Dashboard';$('nl').classList.toggle('hide',role!=='shipper')}
async function data(){let a=await supabaseClient.from('loads').select('*').order('created_at',{ascending:false});if(!a.error)loads=a.data||[];let b=await supabaseClient.from('trips').select('*,loads(*)').or(`driver_id.eq.${session.user.id},shipper_id.eq.${session.user.id}`).order('created_at',{ascending:false});if(!b.error)trips=b.data||[];let c=await supabaseClient.from('notifications').select('*').eq('user_id',session.user.id).order('created_at',{ascending:false}).limit(30);if(!c.error)notes=c.data||[];let active=trips.filter(x=>!['Delivered','Cancelled'].includes(x.status)).length;$('tc').textContent=active;$('sc').textContent=active;$('nc').textContent=notes.filter(x=>!x.read_at).length;$('ncc').textContent=notes.filter(x=>!x.read_at).length}
function heartbeat(){stop();let f=async()=>{if(session)await supabaseClient.from('profiles').update({is_online:true,last_active:new Date().toISOString()}).eq('user_id',session.user.id)};f();beat=setInterval(f,60000);refresh=setInterval(data,30000)}function stop(){if(beat)clearInterval(beat);if(refresh)clearInterval(refresh);beat=refresh=null}
function roleSwitch(r){if(r!==profile.role)return toast('This account is registered as '+profile.role);role=r;header();view='home';render()}function setView(v){view=v;render()}function toggleSide(){let s=$('side');s.style.display=s.style.display==='block'?'none':'block'}function cls(s){return s==='Looking for Driver'?'looking':s==='Driver Assigned'||s==='Assigned'?'assigned':s==='Picked Up'||s==='In Transit'?'transit':s==='Delivered'?'delivered':'looking'}
function render(){['nh','nt','nl','nn'].forEach(x=>$(x).classList.remove('active'));({home:'nh',trips:'nt',loads:'nl',notifications:'nn'})[view]&&$((({home:'nh',trips:'nt',loads:'nl',notifications:'nn'})[view])).classList.add('active');if(role==='driver'&&view==='loads')view='home';$('main').innerHTML=view==='trips'?tripView():view==='loads'?shipperView():view==='notifications'?noteView():view==='settings'?settingsView():role==='driver'?driverView():shipperView()}
function driverView(){let av=loads.filter(x=>x.status==='Looking for Driver');let f=av.filter(x=>(!filters.origin||x.from_city.toLowerCase().includes(filters.origin.toLowerCase()))&&(!filters.destination||x.to_city.toLowerCase().includes(filters.destination.toLowerCase()))&&(!filters.truck||x.truck_type===filters.truck)&&(!filters.min||x.freight_amount>=+filters.min));return `<div class="hero"><div><div class="eyebrow">DRIVER NETWORK</div><h1>Find your next load</h1><p class="muted">Verified freight opportunities from trusted shippers.</p></div><button class="btn primary" onclick="verifyModal()">✓ Verification Center</button></div><div class="grid"><div class="stat"><small>Available Loads</small><strong>${av.length}</strong></div><div class="stat"><small>Active Trips</small><strong>${trips.filter(x=>x.driver_id===session.user.id&&!['Delivered','Cancelled'].includes(x.status)).length}</strong></div><div class="stat"><small>Profile</small><strong>${profile.verification_status==='verified'?'Verified':'Pending'}</strong></div><div class="stat"><small>Online</small><strong>Live</strong></div></div><div class="section"><div class="sectionhead"><h2>Available Loads</h2><span class="muted">${f.length} matching</span></div><div class="filters"><input class="field" placeholder="Origin City" value="${esc(filters.origin)}" oninput="filters.origin=this.value;render()"><input class="field" placeholder="Destination City" value="${esc(filters.destination)}" oninput="filters.destination=this.value;render()"><select class="field" onchange="filters.truck=this.value;render()"><option value="">All Truck Types</option><option>14ft Open</option><option>32ft Multi-Axle</option><option>Trailer</option></select><input class="field" type="number" placeholder="Min ₹" value="${filters.min}" oninput="filters.min=this.value;render()"><button class="btn" onclick="filters={origin:'',destination:'',truck:'',min:''};render()">Reset</button></div><div class="loads">${f.length?f.map(loadCard).join(''):'<div class="card empty">No loads match your filters.</div>'}</div></div>`}
function loadCard(l){return `<div class="card load"><div class="route"><div><div class="city">📍 ${esc(l.from_city)}</div><small>${esc(l.from_state)}</small></div><div class="arrow">→</div><div><div class="city">🏁 ${esc(l.to_city)}</div><small>${esc(l.to_state)}</small></div></div><div class="meta"><span class="tag">${esc(l.material)}</span><span class="tag">${l.weight_tons} Tons</span><span class="tag">${esc(l.truck_type)}</span><span class="tag">${esc(l.price_type)}</span></div><div class="price">₹${money(l.freight_amount)}</div><div class="company"><div><b>${esc(l.company_name||'Shipper')}</b><br><small class="muted">Pickup: ${new Date(l.pickup_at).toLocaleString()}</small></div><span class="status looking">Looking for Driver</span></div><div class="actions"><button class="btn primary" onclick="accept('${l.id}')">Accept / Book</button></div></div>`}
function shipperView(){let mine=loads.filter(x=>x.shipper_id===session.user.id);return `<div class="hero"><div><div class="eyebrow">SHIPPER WORKSPACE</div><h1>Load management</h1><p class="muted">Post freight and manage assignments.</p></div><button class="btn primary" onclick="postModal()">＋ Post New Load</button></div><div class="grid"><div class="stat"><small>My Loads</small><strong>${mine.length}</strong></div><div class="stat"><small>Open</small><strong>${mine.filter(x=>x.status==='Looking for Driver').length}</strong></div><div class="stat"><small>Assigned</small><strong>${mine.filter(x=>x.status==='Driver Assigned').length}</strong></div><div class="stat"><small>Verification</small><strong>${profile.verification_status==='verified'?'✓':'Pending'}</strong></div></div><div class="section"><div class="sectionhead"><h2>My Loads</h2><button class="btn" onclick="verifyModal()">Verification Center</button></div><div class="loads">${mine.length?mine.map(x=>`<div class="card load"><div class="route"><div><div class="city">📍 ${esc(x.from_city)}</div><small>${esc(x.from_state)}</small></div><div class="arrow">→</div><div><div class="city">🏁 ${esc(x.to_city)}</div><small>${esc(x.to_state)}</small></div></div><div class="meta"><span class="tag">${esc(x.material)}</span><span class="tag">${x.weight_tons} Tons</span><span class="tag">${esc(x.truck_type)}</span></div><div class="price">₹${money(x.freight_amount)}</div><div class="company"><b>${esc(x.company_name||profile.company_name||profile.full_name)}</b><span class="status ${cls(x.status)}">${esc(x.status)}</span></div>${x.status==='Looking for Driver'?'<div class="actions"><button class="btn danger" onclick="closeLoad(\''+x.id+'\')">Close Load</button></div>':''}</div>`).join(''):'<div class="card empty">No loads yet. Post your first load.</div>'}</div></div>`}
function tripView(){let m=trips.filter(x=>role==='driver'?x.driver_id===session.user.id:x.shipper_id===session.user.id);return `<div class="hero"><div><div class="eyebrow">LIVE OPERATIONS</div><h1>Active Trips</h1><p class="muted">Track assignments through delivery.</p></div></div><div class="loads">${m.length?m.map(t=>{let l=t.loads||{};return `<div class="card trip"><div><b>${esc(l.from_city)} → ${esc(l.to_city)}</b><div>${esc(l.company_name||'')}</div><small class="muted">₹${money(t.agreed_price)} · ${esc(l.truck_type||'')}</small><div style="margin-top:10px"><span class="status ${cls(t.status)}">${esc(t.status)}</span></div></div><div class="actions">${role==='driver'&&t.status==='Assigned'?`<button class="btn" onclick="trip('${t.id}','Picked Up')">Picked Up</button>`:''}${role==='driver'&&t.status==='Picked Up'?`<button class="btn primary" onclick="trip('${t.id}','In Transit')">Start Transit</button>`:''}${role==='driver'&&t.status==='In Transit'?`<button class="btn primary" onclick="trip('${t.id}','Delivered')">Delivered</button>`:''}${role==='shipper'&&!['Delivered','Cancelled'].includes(t.status)?`<button class="btn danger" onclick="trip('${t.id}','Cancelled')">Cancel</button>`:''}</div></div>`}).join(''):'<div class="card empty">No trips yet.</div>'}</div>`}
function noteView(){return `<div class="hero"><div><div class="eyebrow">ACCOUNT UPDATES</div><h1>Notifications</h1></div><button class="btn" onclick="readAll()">Mark all read</button></div><div class="loads">${notes.length?notes.map(n=>`<div class="card load"><b>${esc(n.title)}</b><p class="muted">${esc(n.message)}</p><small class="muted">${new Date(n.created_at).toLocaleString()}</small></div>`).join(''):'<div class="card empty">No notifications.</div>'}</div>`}
function settingsView(){return `<div class="hero"><div><div class="eyebrow">ACCOUNT</div><h1>Settings</h1></div></div><div class="card load"><div class="formgrid"><div><label>Full Name</label><input id="sn" class="field" value="${esc(profile.full_name)}"></div><div><label>Phone</label><input id="sp" class="field" value="${esc(profile.phone||'')}"></div><div><label>Company</label><input id="scn" class="field" value="${esc(profile.company_name||'')}"></div><div><label>Role</label><input class="field" value="${esc(profile.role)}" disabled></div></div><div class="modalfoot"><button class="btn primary" onclick="saveSettings()">Save Profile</button></div></div>`}
function verifyModal(){let d=role==='driver';openM(`<h2>Verification Center</h2><p class="muted">Submit your details for review.</p><div class="formgrid">${d?'<div><label>Driving License</label><input id="v1" class="field"></div><div><label>Vehicle RC</label><input id="v2" class="field"></div><div><label>Truck Type</label><select id="v3" class="field"><option>14ft Open</option><option>32ft Multi-Axle</option><option>Trailer</option></select></div><div><label>Insurance Valid Until</label><input id="v4" class="field" type="date"></div>':'<div class="full"><label>Company Legal Name</label><input id="v1" class="field"></div><div><label>GSTIN</label><input id="v2" class="field"></div><div><label>Business Address</label><input id="v3" class="field"></div>'}</div><div class="modalfoot"><button class="btn" onclick="closeM()">Cancel</button><button class="btn primary" onclick="submitVerify()">Submit</button></div>`)}
async function submitVerify(){let data=role==='driver'?{dl:$('v1').value,rc:$('v2').value,truck_type:$('v3').value,insurance:$('v4').value}:{legal_name:$('v1').value,gstin:$('v2').value,address:$('v3').value};if(Object.values(data).some(x=>!x))return toast('Complete all fields');let {error}=await supabaseClient.from('verifications').upsert({user_id:session.user.id,role,data,status:'pending'},{onConflict:'user_id'});if(error)return toast(error.message);await supabaseClient.from('profiles').update({verification_status:'pending'}).eq('user_id',session.user.id);profile.verification_status='pending';closeM();toast('Verification submitted for review');render()}
function postModal(){openM(`<h2>Post New Load</h2><div class="formgrid"><div><label>Pickup City *</label><input id="p1" class="field"></div><div><label>Pickup State *</label><input id="p2" class="field"></div><div><label>Drop City *</label><input id="p3" class="field"></div><div><label>Drop State *</label><input id="p4" class="field"></div><div><label>Pickup Pincode</label><input id="p5" class="field"></div><div><label>Commodity</label><select id="p6" class="field"><option>Machinery</option><option>FMCG</option><option>Agriculture</option><option>Steel</option><option>Chemicals</option></select></div><div><label>Weight Tons *</label><input id="p7" class="field" type="number" min=".1" step=".1"></div><div><label>Truck Type</label><select id="p8" class="field"><option>14ft Open</option><option>32ft Multi-Axle</option><option>Trailer</option></select></div><div><label>Freight ₹ *</label><input id="p9" class="field" type="number"></div><div><label>Price Type</label><select id="p10" class="field"><option>Fixed</option><option>Negotiable</option></select></div><div class="full"><label>Pickup Date & Time *</label><input id="p11" class="field" type="datetime-local"></div></div><div class="modalfoot"><button class="btn" onclick="closeM()">Cancel</button><button class="btn primary" onclick="postLoad()">Publish Load</button></div>`)}
async function postLoad(){let ids=['p1','p2','p3','p4','p7','p9','p11'];if(ids.some(x=>!$(x).value))return toast('Complete required fields');let row={shipper_id:session.user.id,from_city:$('p1').value.trim(),from_state:$('p2').value.trim(),to_city:$('p3').value.trim(),to_state:$('p4').value.trim(),pickup_pincode:$('p5').value.trim(),material:$('p6').value,weight_tons:+$('p7').value,truck_type:$('p8').value,freight_amount:+$('p9').value,price_type:$('p10').value,pickup_at:new Date($('p11').value).toISOString(),company_name:profile.company_name||profile.full_name,status:'Looking for Driver'};let {error}=await supabaseClient.from('loads').insert(row);if(error)return toast(error.message);closeM();await data();toast('Load published');render()}
async function accept(id){let {error}=await supabaseClient.rpc('accept_load',{p_load_id:id});if(error)return toast(error.message);await data();view='trips';toast('Load booked successfully');render()}
async function trip(id,status){let {error}=await supabaseClient.from('trips').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)return toast(error.message);await data();toast('Trip updated');render()}
async function closeLoad(id){let {error}=await supabaseClient.from('loads').update({status:'Closed'}).eq('id',id).eq('shipper_id',session.user.id);if(error)return toast(error.message);await data();toast('Load closed');render()}
async function readAll(){await supabaseClient.from('notifications').update({read_at:new Date().toISOString()}).eq('user_id',session.user.id).is('read_at',null);await data();render()}
async function saveSettings(){let {data:x,error}=await supabaseClient.from('profiles').update({full_name:$('sn').value.trim(),phone:$('sp').value.trim(),company_name:$('scn').value.trim()}).eq('user_id',session.user.id).select().single();if(error)return toast(error.message);profile=x;header();toast('Profile updated');render()}
boot();
</script></body></html>
