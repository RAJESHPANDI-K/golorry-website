<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoadLink — Logistics Network</title>
<style>
:root{--bg:#07100d;--panel:#0d1814;--panel2:#111f1a;--line:#20352d;--text:#eef8f3;--muted:#8da79b;--green:#19d58a;--green2:#0fa96b;--danger:#ff6b6b;--amber:#f4c15d;--shadow:0 18px 50px #0008}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#123c2b 0,#07100d 36%),var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{height:72px;border-bottom:1px solid var(--line);background:#08120fdd;backdrop-filter:blur(16px);display:flex;align-items:center;padding:0 28px;gap:24px;position:sticky;top:0;z-index:20}.brand{font-weight:900;font-size:22px;letter-spacing:-.5px}.brand span{color:var(--green)}.switch{display:flex;background:#0b1713;border:1px solid var(--line);padding:4px;border-radius:14px;margin:auto}.switch button{border:0;background:transparent;color:var(--muted);padding:10px 18px;border-radius:10px;font-weight:750}.switch button.active{background:#143126;color:#fff;box-shadow:inset 0 0 0 1px #285441}.top-actions{display:flex;gap:10px;align-items:center}.icon{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#0d1a15;color:#d9eee5}.profile{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#23e99b,#0b6242);display:grid;place-items:center;font-weight:900}.verified{color:#75efb8;background:#0c2b20;border:1px solid #1b674b;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 72px)}aside{border-right:1px solid var(--line);padding:22px 14px;background:#09130f}.navtitle{color:#587168;text-transform:uppercase;font-size:10px;font-weight:900;letter-spacing:1.5px;padding:8px 12px}.nav{display:flex;width:100%;border:0;background:transparent;color:#8fa89e;padding:12px;border-radius:11px;text-align:left;gap:11px;align-items:center;margin:3px 0}.nav.active,.nav:hover{background:#10251c;color:#fff}.count{margin-left:auto;background:#18382b;color:#72efb7;border-radius:999px;padding:2px 7px;font-size:10px}.main{padding:30px;max-width:1500px;width:100%;margin:auto}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px}.eyebrow{color:var(--green);font-weight:800;font-size:12px}.hero h1{font-size:32px;margin:5px 0}.hero p{color:var(--muted);margin:0}.btn{border:1px solid var(--line);background:#112019;color:#eafff5;padding:11px 16px;border-radius:11px;font-weight:800}.btn.primary{background:var(--green);border-color:var(--green);color:#04120c}.btn.primary:hover{background:#3ae9a6}.btn.ghost:hover{border-color:#34745a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat,.card{background:linear-gradient(145deg,#101e18,#0b1713);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px #0002}.stat{padding:18px}.stat small{color:var(--muted)}.stat strong{font-size:26px;display:block;margin-top:8px}.section{margin-top:25px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.section h2{font-size:18px;margin:0}.filters{display:grid;grid-template-columns:1.2fr 1.2fr 1fr .8fr auto;gap:9px;margin-bottom:15px}.field{background:#0b1713;border:1px solid var(--line);border-radius:11px;color:#fff;padding:11px 12px;outline:none;width:100%}.field:focus{border-color:#2d7759}.loads{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.load{padding:18px}.route{display:grid;grid-template-columns:1fr 35px 1fr;align-items:center;gap:10px}.city{font-size:17px;font-weight:850}.pin{color:var(--green);font-size:18px}.arrow{text-align:center;color:#66857a}.meta{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}.tag{background:#14251f;border:1px solid #234237;color:#b9d4c9;padding:5px 8px;border-radius:8px;font-size:11px}.price{font-size:23px;font-weight:900;color:var(--green)}.company{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:13px;margin-top:13px}.actions{display:flex;gap:8px;margin-top:15px}.actions .btn{flex:1}.trip{padding:18px;display:flex;justify-content:space-between;gap:20px;align-items:center}.status{font-size:11px;padding:5px 9px;border-radius:99px;font-weight:850}.looking{color:#f2ca6a;background:#3b2d0e}.assigned{color:#78c9ff;background:#0b2d40}.transit{color:#9be9c8;background:#0b3626}.delivered{color:#b4b9c1;background:#252b2a}.modal-bg{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:50;padding:18px}.modal-bg.show{display:flex}.modal{background:#0c1813;border:1px solid #29473b;border-radius:18px;width:min(680px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow);padding:23px}.modal h2{margin-top:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgroup label{display:block;color:#9db5aa;font-size:12px;margin:0 0 6px}.full{grid-column:1/-1}.modalfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.toast{position:fixed;right:22px;bottom:22px;background:#10251c;border:1px solid #34745a;padding:13px 16px;border-radius:12px;display:none;z-index:80}.empty{padding:30px;text-align:center;color:var(--muted)}.hide{display:none!important}.mobile-menu{display:none}.steps{display:flex;gap:7px;margin-bottom:18px}.step{height:4px;flex:1;background:#21352d;border-radius:4px}.step.on{background:var(--green)}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}.grid{grid-template-columns:repeat(2,1fr)}.loads{grid-template-columns:1fr}.top{padding:0 12px;gap:8px}.switch{margin:auto}.switch button{padding:8px 9px;font-size:11px}.profile .name{display:none}.main{padding:18px}.hero{align-items:start;flex-direction:column}.filters{grid-template-columns:1fr 1fr}.filters .btn{grid-column:1/-1}.mobile-menu{display:block}.top-actions .icon{display:none}}
@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.switch button{padding:8px 6px}.hero h1{font-size:26px}.trip{align-items:start;flex-direction:column}.actions{flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <button class="icon mobile-menu" onclick="toggleSidebar()">☰</button>
  <div class="brand">Load<span>Link</span></div>
  <div class="switch">
    <button id="driverSwitch" class="active" onclick="setRole('driver')">🚚 Driver Portal</button>
    <button id="shipperSwitch" onclick="setRole('shipper')">🏢 Shipper / Owner</button>
  </div>
  <div class="top-actions">
    <button class="icon" onclick="notify('No new notifications')">🔔</button>
    <button class="icon" onclick="setView('trips')">📦 <b id="orderCount">2</b></button>
    <div class="profile"><div class="avatar">RP</div><div class="name"><b id="profileName">Rajesh Pandi</b><br><span class="verified">✓ Verified Partner</span></div></div>
  </div>
</header>
<div class="layout">
<aside id="sidebar">
  <div class="navtitle">Workspace</div>
  <button class="nav active" id="navHome" onclick="setView('home')">⌂ <span id="homeLabel">Find Loads</span></button>
  <button class="nav" id="navTrips" onclick="setView('trips')">▣ <span>Active Trips</span><span class="count" id="sideCount">2</span></button>
  <button class="nav" id="navLoads" onclick="setView('loads')">◫ <span>My Loads</span></button>
  <div class="navtitle">Trust & Account</div>
  <button class="nav" onclick="openVerify()">✓ <span>Verification Center</span></button>
  <button class="nav" onclick="notify('Settings are available in the production backend.')">⚙ <span>Settings</span></button>
</aside>
<main class="main" id="main"></main>
</div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const state={
 role:'driver', view:'home', verified:{driver:true,shipper:false},
 filters:{origin:'',destination:'',truck:'',min:''},
 loads:[
  {id:1,from:'Bengaluru',to:'Chennai',fs:'Karnataka',ts:'Tamil Nadu',material:'Machinery',weight:12,truck:'32ft Multi-Axle',price:42000,deal:'Fixed',age:'30 mins ago',company:'Apex Industrial Logistics',phone:'9876543210',status:'Looking for Driver'},
  {id:2,from:'Hosur',to:'Coimbatore',fs:'Tamil Nadu',ts:'Tamil Nadu',material:'FMCG',weight:8,truck:'14ft Open',price:18500,deal:'Negotiable',age:'1 hr ago',company:'GreenMart Supply Co.',phone:'9123456780',status:'Looking for Driver'},
  {id:3,from:'Bengaluru',to:'Hyderabad',fs:'Karnataka',ts:'Telangana',material:'Steel',weight:20,truck:'Trailer',price:56000,deal:'Fixed',age:'2 hrs ago',company:'Southline Metals',phone:'9988776655',status:'Looking for Driver'}
 ],
 trips:[
  {id:101,from:'Chennai',to:'Bengaluru',company:'Metro Components',phone:'9000011111',status:'In Transit'},
  {id:102,from:'Bengaluru',to:'Mysuru',company:'Kaveri Foods',phone:'9000022222',status:'Assigned'}
 ]
};
function $(id){return document.getElementById(id)}
function notify(msg){$('toast').textContent=msg;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}
function openModal(html){$('modal').innerHTML=html;$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show')}
$('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()})
function setRole(role){state.role=role;state.view='home';$('driverSwitch').classList.toggle('active',role==='driver');$('shipperSwitch').classList.toggle('active',role==='shipper');$('homeLabel').textContent=role==='driver'?'Find Loads':'Dashboard';render()}
function setView(v){state.view=v;render()}
function toggleSidebar(){const s=$('sidebar');s.style.display=s.style.display==='block'?'none':'block'}
function render(){
 $('navLoads').classList.toggle('hide',state.role==='driver');
 $('navHome').classList.toggle('active',state.view==='home');
 $('navTrips').classList.toggle('active',state.view==='trips');
 $('navLoads').classList.toggle('active',state.view==='loads');
 $('sideCount').textContent=state.trips.length;$('orderCount').textContent=state.trips.length;
 $('main').innerHTML=state.role==='driver'?driverView():shipperView();
}
function driverView(){
 if(state.view==='trips')return tripsView();
 const filtered=state.loads.filter(l=>
 (!state.filters.origin||l.from.toLowerCase().includes(state.filters.origin.toLowerCase()))&&
 (!state.filters.destination||l.to.toLowerCase().includes(state.filters.destination.toLowerCase()))&&
 (!state.filters.truck||l.truck===state.filters.truck)&&
 (!state.filters.min||l.price>=Number(state.filters.min))
 );
 return `<div class="hero"><div><div class="eyebrow">DRIVER NETWORK</div><h1>Find your next load</h1><p>Verified freight opportunities from trusted shippers.</p></div><button class="btn primary" onclick="openVerify()">✓ Verification Center</button></div>
 <div class="grid"><div class="stat"><small>Available Loads</small><strong>${state.loads.filter(x=>x.status==='Looking for Driver').length}</strong></div><div class="stat"><small>Active Trips</small><strong>${state.trips.length}</strong></div><div class="stat"><small>Verified Network</small><strong>98%</strong></div><div class="stat"><small>Today's Earnings</small><strong>₹42,000</strong></div></div>
 <div class="section"><div class="sectionhead"><h2>Available Loads</h2><span style="color:var(--muted)">${filtered.length} matching loads</span></div>
 <div class="filters"><input class="field" placeholder="Origin City" value="${state.filters.origin}" oninput="state.filters.origin=this.value;render()"><input class="field" placeholder="Destination City" value="${state.filters.destination}" oninput="state.filters.destination=this.value;render()"><select class="field" onchange="state.filters.truck=this.value;render()"><option value="">All Truck Types</option><option>14ft Open</option><option>32ft Multi-Axle</option><option>Trailer</option></select><input class="field" type="number" placeholder="Min ₹" value="${state.filters.min}" oninput="state.filters.min=this.value;render()"><button class="btn" onclick="state.filters={origin:'',destination:'',truck:'',min:''};render()">Reset</button></div>
 <div class="loads">${filtered.length?filtered.map(loadCard).join(''):'<div class="card empty">No loads match these filters.</div>'}</div></div>`;
}
function loadCard(l){
return `<div class="card load"><div class="route"><div><div class="city">📍 ${l.from}</div><small>${l.fs}</small></div><div class="arrow">→</div><div><div class="city">🏁 ${l.to}</div><small>${l.ts}</small></div></div>
<div class="meta"><span class="tag">${l.material}</span><span class="tag">${l.weight} Tons</span><span class="tag">${l.truck}</span><span class="tag">${l.deal}</span></div>
<div class="price">₹${l.price.toLocaleString('en-IN')} <small style="font-size:11px;color:var(--muted);font-weight:500">est. freight</small></div>
<div class="company"><div><b>${l.company}</b> <span class="verified">✓ GST Verified</span><br><small style="color:var(--muted)">${l.age}</small></div></div>
<div class="actions"><a class="btn" href="tel:${l.phone}" style="text-align:center;text-decoration:none">☎ Call Owner</a><a class="btn" href="https://wa.me/91${l.phone}?text=${encodeURIComponent('Hi, I am interested in your LoadLink load: '+l.from+' to '+l.to+' | '+l.material+' | '+l.weight+' Tons | ₹'+l.price)}" target="_blank" style="text-align:center;text-decoration:none">◉ WhatsApp</a><button class="btn primary" onclick="acceptLoad(${l.id})">Accept / Book</button></div></div>`;
}
function tripsView(){
return `<div class="hero"><div><div class="eyebrow">LIVE OPERATIONS</div><h1>Active Trips</h1><p>Manage accepted loads from pickup to delivery.</p></div></div>
<div class="section"><div class="loads">${state.trips.length?state.trips.map(t=>`<div class="card trip"><div><b>${t.from} → ${t.to}</b><div style="margin-top:7px">${t.company} <span class="verified">✓ Verified</span></div><small style="color:var(--muted)">Pickup contact: ${t.phone}</small><div style="margin-top:10px"><span class="status ${t.status==='In Transit'?'transit':t.status==='Delivered'?'delivered':'assigned'}">${t.status}</span></div></div><div class="actions"><button class="btn" onclick="tripAction(${t.id},'Picked Up')">Mark as Picked Up</button><button class="btn primary" onclick="tripAction(${t.id},'Delivered')">Mark as Delivered</button></div></div>`).join(''):'<div class="card empty">No active trips. Accept a load to start.</div>'}</div></div>`;
}
function shipperView(){
if(state.view==='trips')return tripsView();
const active=state.loads.filter(l=>l.company==='LoadLink Demo Logistics');
return `<div class="hero"><div><div class="eyebrow">SHIPPER WORKSPACE</div><h1>Load management</h1><p>Post freight, find verified drivers and stop duplicate calls.</p></div><button class="btn primary" onclick="openPostLoad()">＋ Post New Load</button></div>
<div class="grid"><div class="stat"><small>Active Loads</small><strong>${active.filter(x=>x.status!=='Delivered').length}</strong></div><div class="stat"><small>Looking for Driver</small><strong>${active.filter(x=>x.status==='Looking for Driver').length}</strong></div><div class="stat"><small>Assigned</small><strong>${active.filter(x=>x.status==='Driver Assigned').length}</strong></div><div class="stat"><small>GST Status</small><strong>${state.verified.shipper?'✓ Verified':'Pending'}</strong></div></div>
<div class="section"><div class="sectionhead"><h2>My Active Loads</h2><button class="btn" onclick="openVerify()">Verification Center</button></div>
<div class="loads">${active.length?active.map(l=>`<div class="card load"><div class="route"><div><div class="city">📍 ${l.from}</div><small>${l.fs}</small></div><div class="arrow">→</div><div><div class="city">🏁 ${l.to}</div><small>${l.ts}</small></div></div><div class="meta"><span class="tag">${l.material}</span><span class="tag">${l.weight} Tons</span><span class="tag">${l.truck}</span></div><div class="price">₹${l.price.toLocaleString('en-IN')}</div><div class="company"><b>${l.company}</b><span class="status ${l.status==='Looking for Driver'?'looking':l.status==='Driver Assigned'?'assigned':'transit'}">${l.status}</span></div><div class="actions"><button class="btn" onclick="changeLoadStatus(${l.id})">Mark Assigned / Closed</button></div></div>`).join(''):'<div class="card empty">No loads yet. Post your first load.</div>'}</div></div>`;
}
function openVerify(){
const d=state.role==='driver';
openModal(`<h2>✓ Verification Center</h2><p style="color:var(--muted)">Submit your business details. Demo mode marks the profile verified immediately.</p>
<div class="steps"><div class="step on"></div><div class="step on"></div><div class="step"></div></div>
<div class="formgrid">${d?`<div class="formgroup"><label>Driving License (DL) Number</label><input id="v1" class="field" placeholder="KA01 2024 0000000"></div><div class="formgroup"><label>Vehicle RC Number</label><input id="v2" class="field" placeholder="KA01AB1234"></div><div class="formgroup"><label>Truck Type</label><select id="v3" class="field"><option>14ft Open</option><option>32ft Multi-Axle</option><option>Trailer</option></select></div><div class="formgroup"><label>Insurance Valid Until</label><input id="v4" class="field" type="date"></div>`:`<div class="formgroup full"><label>Company Legal Name</label><input id="v1" class="field" placeholder="Legal registered name"></div><div class="formgroup"><label>GSTIN / Business Registration</label><input id="v2" class="field" placeholder="29ABCDE1234F1Z5"></div><div class="formgroup"><label>Registered Warehouse / Office Address</label><input id="v3" class="field" placeholder="Full registered address"></div>`}</div>
<div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="verifyNow()">Submit & Verify</button></div>`);
}
function verifyNow(){state.verified[state.role]=true;notify(state.role==='driver'?'Verified Driver badge activated':'GST Verified Shipper badge activated');closeModal();render()}
function openPostLoad(){
openModal(`<h2>Post New Load</h2><p style="color:var(--muted)">Create a freight opportunity for verified drivers.</p><div class="steps"><div class="step on"></div><div class="step on"></div><div class="step on"></div></div>
<div class="formgrid"><div class="formgroup"><label>Pickup City</label><input id="p1" class="field" placeholder="Bengaluru"></div><div class="formgroup"><label>Pickup State</label><input id="p2" class="field" placeholder="Karnataka"></div><div class="formgroup"><label>Drop City</label><input id="p3" class="field" placeholder="Chennai"></div><div class="formgroup"><label>Drop State</label><input id="p4" class="field" placeholder="Tamil Nadu"></div><div class="formgroup"><label>Pickup Pin Code</label><input id="p5" class="field" placeholder="560001"></div><div class="formgroup"><label>Commodity</label><select id="p6" class="field"><option>Machinery</option><option>FMCG</option><option>Agriculture</option><option>Steel</option><option>Chemicals</option></select></div><div class="formgroup"><label>Load Weight (Tonnes)</label><input id="p7" class="field" type="number" min="0"></div><div class="formgroup"><label>Required Truck Body</label><select id="p8" class="field"><option>14ft Open</option><option>32ft Multi-Axle</option><option>Trailer</option></select></div><div class="formgroup"><label>Expected Freight (₹)</label><input id="p9" class="field" type="number"></div><div class="formgroup"><label>Price Type</label><select id="p10" class="field"><option>Fixed</option><option>Negotiable</option></select></div><div class="formgroup full"><label>Pickup Date & Time</label><input id="p11" class="field" type="datetime-local"></div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="postLoad()">Publish Load</button></div>`);
}
function postLoad(){
const req=['p1','p2','p3','p4','p5','p7','p9','p11'];if(req.some(id=>!$(id).value)){notify('Please complete the required fields');return}
state.loads.unshift({id:Date.now(),from:$('p1').value,to:$('p3').value,fs:$('p2').value,ts:$('p4').value,material:$('p6').value,weight:Number($('p7').value),truck:$('p8').value,price:Number($('p9').value),deal:$('p10').value,age:'Just now',company:'LoadLink Demo Logistics',phone:'9000000000',status:'Looking for Driver'});closeModal();notify('Load published successfully');render();
}
function acceptLoad(id){
const l=state.loads.find(x=>x.id===id);if(!l||l.status!=='Looking for Driver'){notify('This load is no longer available');return}
openModal(`<h2>Confirm Load Booking</h2><p>You are booking <b>${l.from} → ${l.to}</b> for <b>₹${l.price.toLocaleString('en-IN')}</b>.</p><div class="card" style="padding:14px"><b>${l.company}</b><br>${l.material} · ${l.weight} Tons · ${l.truck}</div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="confirmAccept(${id})">Confirm & Add to Active Trips</button></div>`);
}
function confirmAccept(id){const l=state.loads.find(x=>x.id===id);if(!l)return;l.status='Driver Assigned';state.trips.unshift({id:Date.now(),from:l.from,to:l.to,company:l.company,phone:l.phone,status:'Assigned'});closeModal();state.view='trips';notify('Load accepted — added to Active Trips');render()}
function tripAction(id,status){const t=state.trips.find(x=>x.id===id);if(!t)return;t.status=status;notify(status==='Delivered'?'Trip delivered successfully':'Pickup marked successfully');render()}
function changeLoadStatus(id){const l=state.loads.find(x=>x.id===id);if(!l)return;l.status=l.status==='Looking for Driver'?'Driver Assigned':'Delivered';notify('Load status updated');render()}
render();
</script>
</body>
</html>
